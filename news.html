<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новини — головне за день</title>
<meta name="description" content="Головні новини дня коротко і по суті. Підпишіться на Telegram-канал з новинами.">
<style>
:root{--bg:#0b0d12;--card:#151822;--text:#e7e9ee;--muted:#8b93a7;--accent:#4f8cff;--border:#232838;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.topbar{max-width:760px;margin:0 auto;padding:20px 20px 0}
.topbar a{color:var(--muted);text-decoration:none;font-size:.85rem}
.topbar a:hover{color:var(--accent)}
header{max-width:760px;margin:0 auto;padding:20px 20px 24px}
header h1{font-size:1.7rem;margin:0 0 8px}
.subscribe{display:inline-block;margin-top:6px;background:var(--accent);color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-size:.9rem;font-weight:600}
.subscribe:hover{opacity:.9}
main{max-width:760px;margin:0 auto;padding:0 20px 60px}
article{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
article h2{font-size:1.05rem;margin:0 0 8px}
article p{margin:0;color:#c9cedb;font-size:.92rem}
article small{color:var(--muted);display:block;margin-top:10px;font-size:.78rem}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:.92rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}

</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Всі канали</a></div>
<header>
  <h1>📰 Новини</h1>
  <a class="subscribe" href="#">Підписатися на канал →</a>
</header>
<main>
<div id="posts">
<!-- POSTS_START -->
<div class="empty">Стрічка новин скоро запрацює. Слідкуйте за оновленнями.</div>
<!-- POSTS_END -->
</div>
</main>
<footer>© 2026 · Оновлюється автоматично</footer>
</body>
</html>
